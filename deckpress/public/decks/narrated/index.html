<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Deckpress Narrated — Investor Deck</title>
  <meta name="description" content="Watch the founder pitch — interactive narrated deck by Deckpress.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/decks/narrated/css/style.css">
</head>
<body>

  <div class="narrated-deck">
    <!-- =================================================================
         SLIDES — full viewport, crossfade transitions.
         Populated by app.js from DECK_CONFIG.sections.
         ================================================================= -->
    <div id="slides-container" class="slides-container"></div>

    <!-- =================================================================
         PIP FOUNDER VIDEO — persistent, draggable, bottom-right.
         Plays the continuous narration video. Cue sync auto-advances
         slides as the founder speaks.
         ================================================================= -->
    <div id="pip-video" class="pip-video" aria-label="Founder narration video">
      <video id="narration-video" preload="metadata" playsinline>
        <source id="narration-source-webm" src="" type="video/webm">
        <source id="narration-source-mp4" src="" type="video/mp4">
      </video>
      <button id="pip-play-overlay" class="pip-play-overlay" type="button" aria-label="Play founder pitch">
        <span class="pip-play-icon">&#9654;</span>
        <span class="pip-play-label">Watch Pitch</span>
      </button>
      <div class="pip-controls" id="pip-controls">
        <button id="pip-pause" class="pip-ctrl-btn" type="button" aria-label="Pause">&#10074;&#10074;</button>
        <button id="pip-minimize" class="pip-ctrl-btn" type="button" aria-label="Minimize">&#8212;</button>
      </div>
      <!-- Minimized state: shows initials circle -->
      <button id="pip-minimized" class="pip-minimized hidden" type="button" aria-label="Expand founder video"></button>
    </div>

    <!-- =================================================================
         TIMELINE BAR — fixed bottom. Shows video progress, cue markers,
         slide navigation dots.
         ================================================================= -->
    <footer class="timeline-bar">
      <button id="timeline-play" class="timeline-play-btn" type="button" aria-label="Play/pause narration">
        &#9654;
      </button>
      <div id="timeline-track" class="timeline-track">
        <div id="timeline-progress" class="timeline-progress"></div>
        <!-- Cue markers injected by app.js -->
      </div>
      <span id="timeline-time" class="timeline-time">0:00 / 0:00</span>
      <div id="timeline-dots" class="timeline-dots">
        <!-- Slide dots injected by app.js -->
      </div>
    </footer>
  </div>

  <!-- Chat + feedback (same contract as other templates) -->
  <div id="chat-root"></div>
  <div id="feedback-root"></div>

  <!-- Config (generated by build:config) -->
  <script src="/decks/narrated/js/config.js"></script>

  <!-- App -->
  <script src="/decks/narrated/js/app.js"></script>
  <script src="/decks/narrated/js/chat.js"></script>
  <script src="/decks/narrated/js/analytics.js"></script>
  <script src="/decks/narrated/js/feedback.js"></script>
</body>
</html>
