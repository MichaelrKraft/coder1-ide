events {}

http {
    # Define the backend (Next.js app running on host)
    upstream next_app {
        server host.docker.internal:3000;
    }

    server {
        listen 80;

        # 1. Static Assets - Perfectly Stable
        location /_next/ {
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # 2. Socket.IO - "Hostile" Configuration
        location /socket.io/ {
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            # Aggressive Timeouts to simulate Load Balancer drops
            # If the handshake takes > 1s, kill it.
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s; 
            proxy_send_timeout 5s;
            
            # Disable buffering for WebSockets
            proxy_buffering off;
        }

        # 3. Default Fallback
        location / {
            proxy_pass http://next_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
