name: Build Bridge Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Manual trigger
    inputs:
      skip_test:
        description: 'Skip running tests before build'
        required: false
        default: 'false'

jobs:
  build-macos-arm64:
    name: Build macOS ARM64 (Apple Silicon)
    runs-on: macos-14  # M1/M2 runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: coder1-ide-next/bridge-cli
        run: npm ci

      - name: Install pkg globally
        run: npm install -g @yao-pkg/pkg

      - name: Build binary
        working-directory: coder1-ide-next/bridge-cli
        run: |
          pkg . --target node20-macos-arm64 --output coder1-bridge-macos-arm64
          chmod +x coder1-bridge-macos-arm64

      - name: Test binary
        if: ${{ github.event.inputs.skip_test != 'true' }}
        working-directory: coder1-ide-next/bridge-cli
        run: |
          ./coder1-bridge-macos-arm64 --version || true
          ./coder1-bridge-macos-arm64 diagnose || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coder1-bridge-macos-arm64
          path: coder1-ide-next/bridge-cli/coder1-bridge-macos-arm64

  build-macos-x64:
    name: Build macOS x64 (Intel)
    runs-on: macos-13  # Intel runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: coder1-ide-next/bridge-cli
        run: npm ci

      - name: Install pkg globally
        run: npm install -g @yao-pkg/pkg

      - name: Build binary
        working-directory: coder1-ide-next/bridge-cli
        run: |
          pkg . --target node20-macos-x64 --output coder1-bridge-macos-x64
          chmod +x coder1-bridge-macos-x64

      - name: Test binary
        if: ${{ github.event.inputs.skip_test != 'true' }}
        working-directory: coder1-ide-next/bridge-cli
        run: |
          ./coder1-bridge-macos-x64 --version || true
          ./coder1-bridge-macos-x64 diagnose || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coder1-bridge-macos-x64
          path: coder1-ide-next/bridge-cli/coder1-bridge-macos-x64

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        working-directory: coder1-ide-next/bridge-cli
        run: npm ci

      - name: Install pkg globally
        run: npm install -g @yao-pkg/pkg

      - name: Build binary
        working-directory: coder1-ide-next/bridge-cli
        run: |
          pkg . --target node20-linux-x64 --output coder1-bridge-linux
          chmod +x coder1-bridge-linux

      - name: Test binary
        if: ${{ github.event.inputs.skip_test != 'true' }}
        working-directory: coder1-ide-next/bridge-cli
        run: |
          ./coder1-bridge-linux --version || true
          ./coder1-bridge-linux diagnose || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coder1-bridge-linux
          path: coder1-ide-next/bridge-cli/coder1-bridge-linux

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: coder1-ide-next/bridge-cli
        run: npm ci

      - name: Install pkg globally
        run: npm install -g @yao-pkg/pkg

      - name: Build binary
        working-directory: coder1-ide-next/bridge-cli
        run: pkg . --target node20-win-x64 --output coder1-bridge-win.exe

      - name: Test binary
        if: ${{ github.event.inputs.skip_test != 'true' }}
        working-directory: coder1-ide-next/bridge-cli
        run: |
          .\coder1-bridge-win.exe --version
          .\coder1-bridge-win.exe diagnose
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coder1-bridge-win
          path: coder1-ide-next/bridge-cli/coder1-bridge-win.exe

  # Combine all artifacts into a single release
  create-release:
    name: Create Release Bundle
    needs: [build-macos-arm64, build-macos-x64, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: List downloaded files
        run: ls -la binaries/*/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            binaries/coder1-bridge-macos-arm64/coder1-bridge-macos-arm64
            binaries/coder1-bridge-macos-x64/coder1-bridge-macos-x64
            binaries/coder1-bridge-linux/coder1-bridge-linux
            binaries/coder1-bridge-win/coder1-bridge-win.exe
          body: |
            ## Coder1 Bridge Binaries

            Pre-built binaries for connecting your local Claude CLI to Coder1 IDE.

            ### Downloads
            - **macOS Apple Silicon (M1/M2/M3)**: `coder1-bridge-macos-arm64`
            - **macOS Intel**: `coder1-bridge-macos-x64`
            - **Linux x64**: `coder1-bridge-linux`
            - **Windows x64**: `coder1-bridge-win.exe`

            ### Installation
            1. Download the binary for your platform
            2. Make it executable (macOS/Linux): `chmod +x coder1-bridge-*`
            3. Run: `./coder1-bridge-* start`

            ### Alternative: npm install
            ```bash
            npm install -g coder1-bridge
            coder1-bridge start
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
